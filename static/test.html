<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #eaeaea;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            margin-top: 20px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .video-box {
            flex: 2;
            display: flex;
            flex-direction: column;
        }
        .video-box img {
            width: 100%;
            border-radius: 6px;
            border: 2px solid #444;
            background: #000;
        }
        .control-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #005999;
        }
        #resultOutput {
            background: #111;
            padding: 15px;
            border-left: 4px solid #007acc;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>System Live Control Center</h1>

    <div class="container">
        <div class="card video-box">
            <h2>Live Camera Stream</h2>
            <img src="http://127.0.0.1:8000/video_feed" alt="Live Stream Feed" />
        </div>

        <div class="card control-box">
            <h2>AI Diagnostic Trigger</h2>
            <p>Click below to capture the current live frame and pass it through the ONNX analytical model pipeline.</p>
            
            <button onclick="triggerAnalysis()">Analyze Live Frame</button>

            <h3>Backend Response Data:</h3>
            <div id="resultOutput">No analysis run yet. Trigger above.</div>
        </div>
    </div>

    <script>
        async function triggerAnalysis() {
            const outputDiv = document.getElementById('resultOutput');
            outputDiv.innerText = "Capturing frame and running ONNX model...";

            try {
                // Post to your FastAPI server telling it to extract a frame from the live buffer
                const response = await fetch('http://127.0.0.1:8000/analyse', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        file_dir: "CAMERA",
                        user_id: 1 // Assuming User ID 1 exists in your app.db
                    })
                });

                const data = await response.json();
                
                // Format the JSON beautifully into the browser text window
                outputDiv.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                outputDiv.innerText = "Error contacting backend server: " + error.message;
            }
        }
    </script>
</body>
</html>
